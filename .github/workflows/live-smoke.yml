name: live-smoke

# Checks the public read-only API's HTTP contract from GitHub's network (CORS on 304s,
# ETags, Link pagination, problem+json, read-only writes, no source paths served).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - run: node scripts/smoke.js https://developer-opportunity-radar.vercel.app
